# nginx site for approvals.zimstat.co.zw -> ZimStat Approvals container on 127.0.0.1:3443
#
#   sudo cp deploy/nginx/approvals.zimstat.co.zw.conf /etc/nginx/sites-available/approvals.zimstat.co.zw
#   sudo ln -s /etc/nginx/sites-available/approvals.zimstat.co.zw /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d approvals.zimstat.co.zw -d www.approvals.zimstat.co.zw     # adds the HTTPS server block + redirect
#
# Only this server_name is touched; other sites on the box keep working.

# Rate limits for credential endpoints (defence in depth on top of the app's own limiter).
limit_req_zone $binary_remote_addr zone=zimstat_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=zimstat_api:10m rate=600r/m;

server {
    listen 80;
    listen [::]:80;
    server_name approvals.zimstat.co.zw www.approvals.zimstat.co.zw;

    server_tokens off;
    client_max_body_size 26m;          # attachment uploads (25 MB + multipart overhead)
    client_body_timeout 60s;

    location ~ ^/api/auth/(login|register|password|2fa|verify-email) {
        limit_req zone=zimstat_auth burst=20 nodelay;
        proxy_pass         http://127.0.0.1:3443;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=zimstat_api burst=100 nodelay;
        proxy_pass         http://127.0.0.1:3443;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass         http://127.0.0.1:3443;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
