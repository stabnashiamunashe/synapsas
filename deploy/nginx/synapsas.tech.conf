# nginx site for synapsas.tech -> Synapsas app container on 127.0.0.1:3443
#
#   sudo cp deploy/nginx/synapsas.tech.conf /etc/nginx/sites-available/synapsas.tech
#   sudo ln -s /etc/nginx/sites-available/synapsas.tech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d synapsas.tech -d www.synapsas.tech     # adds the HTTPS server block + redirect
#
# Only this server_name is touched; other sites on the box keep working.

server {
    listen 80;
    listen [::]:80;
    server_name synapsas.tech www.synapsas.tech;

    client_max_body_size 25m;          # attachment uploads

    location / {
        proxy_pass         http://127.0.0.1:3443;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 120s;
    }
}
