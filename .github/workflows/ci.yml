name: CI

on:
  push:
    branches: [master, billing]
  pull_request:

permissions:
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
        continue-on-error: true
      - name: Dependency audit (production deps, high+)
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          DATABASE_URL: mysql://x:x@localhost:3306/x
          AUTH_SECRET: ci-only-secret-not-used-at-runtime-0123456789
          APP_URL: https://ci.invalid

  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t synapsas/app:ci .
      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: synapsas/app:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
