# ZimStat Approvals production stack: app (UI + API) on host port 3443 and MariaDB 11. Put nginx in front for the domain (deploy/nginx/).
#   cp .env.docker.example .env && nano .env
#   docker compose up -d --build
#   docker compose --profile seed run --rm seed      # optional demo data, first time only

services:
  db:
    # MariaDB (same family as XAMPP's bundled server): accepts the schema's TEXT column defaults, which MySQL 8 rejects.
    image: mariadb:11
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: documentdb
      MARIADB_USER: synapsas
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: zimstat/approvals:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://synapsas:${DB_PASSWORD}@db:3306/documentdb
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:3443:3000" # only nginx on the host reaches the app; the domain fronts it over HTTPS
    volumes:
      - uploads:/app/uploads
    tmpfs:
      - /tmp
      - /app/.next/cache
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 512
    depends_on:
      db:
        condition: service_healthy

  # One-off: load the demo workspace (ict.admin@zimstat.co.zw / Password123!).
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: mysql://synapsas:${DB_PASSWORD}@db:3306/documentdb
    command: ["npx", "tsx", "prisma/seed.ts"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
