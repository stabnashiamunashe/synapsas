# Synapsas production stack: app (UI + API) on host port 3443 and MariaDB 11. Put nginx in front for the domain (deploy/nginx/).
#   cp .env.docker.example .env && nano .env
#   docker compose up -d --build
#   docker compose --profile seed run --rm seed      # optional demo data, first time only

services:
  db:
    # MariaDB (same family as XAMPP's bundled server): accepts the schema's TEXT column defaults, which MySQL 8 rejects.
    image: mariadb:11
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_DATABASE: documentdb
      MARIADB_USER: synapsas
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    image: synapsas/app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: mysql://synapsas:${DB_PASSWORD}@db:3306/documentdb
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
    ports:
      - "3443:3000"          # direct access: http://<vm-ip>:3443
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  # One-off: load the demo workspace (owner@acme.test / Password123!).
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: mysql://synapsas:${DB_PASSWORD}@db:3306/documentdb
    command: ["npx", "tsx", "prisma/seed.ts"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  uploads:
