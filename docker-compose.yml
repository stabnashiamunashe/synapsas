# ZimStat Approvals production stack: app (UI + API) on host port 3443 and PostgreSQL 16. Put nginx in front for the domain (deploy/nginx/).
#   cp .env.docker.example .env && nano .env
#   bash scripts/deploy-docker.sh                                           # build, start, sync the schema, create the administrator
#   docker compose --profile seed run --rm seed npx tsx prisma/seed.ts      # optional demo workspace (never on a live system)
#   bash scripts/backup-db.sh                                               # compressed pg_dump into backups/

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-approvals}
      POSTGRES_USER: ${DB_USER:-synapsas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    # sized for a small VPS; raise shared_buffers with the server's RAM (about a quarter of it)
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB", "-c", "work_mem=8MB", "-c", "log_min_duration_statement=2000"]
    volumes:
      - pg_data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-synapsas} -d ${DB_NAME:-approvals}"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g

  app:
    build: .
    image: zimstat/approvals:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-synapsas}:${DB_PASSWORD}@db:5432/${DB_NAME:-approvals}?schema=public&connection_limit=20
      PORT: "3000"
      UPLOAD_DIR: /app/uploads
    ports:
      - "127.0.0.1:3443:3000" # only nginx on the host reaches the app; the domain fronts it over HTTPS
    volumes:
      - uploads:/app/uploads
    tmpfs:
      - /tmp
      - /app/.next/cache
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 1g
    pids_limit: 512
    depends_on:
      db:
        condition: service_healthy

  # One-off tasks that need the full toolchain (tsx, Prisma CLI). Default: make sure the organisation and the
  # administrator exist (prisma/seed-admin.ts; idempotent). Run by scripts/deploy-docker.sh after every deploy.
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: build
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-synapsas}:${DB_PASSWORD}@db:5432/${DB_NAME:-approvals}?schema=public
    command: ["npx", "tsx", "prisma/seed-admin.ts"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  uploads:
